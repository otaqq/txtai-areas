<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>txtai-areas graph</title>
<!-- Cytoscape.js (MIT): graph drawing -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
  :root { --bg: #fafafa; --fg: #222; --muted: #777; --panel: #fff; --line: #ddd; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16181d; --fg: #e6e6e6; --muted: #999; --panel: #1f2229; --line: #333; --accent: #60a5fa; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  select, input[type=search] { font: inherit; padding: 4px 6px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
  #stats { color: var(--muted); }
  main { flex: 1; display: flex; min-height: 0; position: relative; }
  button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  /* Two ways to choose an area, switched in the header: a tree on the left, or one drop-down per level */
  #modes { display: flex; gap: 4px; }
  #crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  #crumbs .sep { color: var(--muted); }
  body.mode-tree #crumbs, body.mode-crumbs #tree, body.mode-crumbs #treebtn { display: none; }
  #tree { width: 260px; flex: none; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #tree.closed { display: none; }
  #tree input { margin: 8px; }
  #tree-list { overflow: auto; flex: 1; padding: 0 4px 8px; }
  #tree ul { list-style: none; margin: 0; padding-left: 14px; }
  #tree-list > ul { padding-left: 0; }
  #tree .row { display: flex; align-items: center; gap: 2px; padding: 1px 4px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  #tree .row:hover { background: var(--bg); }
  #tree .row.current { background: var(--accent); color: #fff; }
  #tree .row:not(.area) .name { color: var(--muted); }
  #tree .row.current .name { color: #fff; }
  #tree .twisty { border: 0; background: none; color: inherit; width: 18px; padding: 0; flex: none; }
  #tree .name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #tree .count { font-size: 11px; opacity: 0.7; }
  #cy { flex: 1; min-width: 0; }
  #graph { flex: 1; min-width: 0; display: flex; position: relative; }
  #hint { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; padding: 16px; text-align: center; }
  /* search hits: pick one to draw the sections around it */
  #hits { width: 280px; flex: none; border-right: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px; }
  #hits h3 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: normal; }
  #hits h3 button { float: right; }
  #hits ol { margin: 0; padding-left: 22px; }
  #hits li { padding: 3px 0; cursor: pointer; }
  #hits li:hover .label, #hits li.current .label { color: var(--accent); }
  #hits .file { display: block; color: var(--muted); font-size: 11px; word-break: break-all; }
  aside { width: min(40%, 520px); border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 12px 16px; display: none; }
  aside.open { display: block; }
  aside h2 { font-size: 15px; margin: 0 0 4px; }
  aside .src { color: var(--muted); font-size: 12px; margin-bottom: 8px; word-break: break-all; }
  aside pre { white-space: pre-wrap; word-break: break-word; font: 13px/1.6 system-ui, sans-serif; margin: 0; }
  aside button { float: right; }
  @media (max-width: 700px) { #hits { position: absolute; inset: 0 auto 0 0; width: min(85%, 320px); z-index: 1; } }
  @media (max-width: 700px) { #tree { position: absolute; inset: 0 auto 0 0; width: min(85%, 320px); z-index: 2; } }
  @media (max-width: 700px) { aside { position: fixed; inset: 40% 0 0 0; width: auto; border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>txtai-areas</h1>
  <span id="modes"><button id="m-tree">Tree</button><button id="m-crumbs">Levels</button></span>
  <button id="treebtn" title="Show or hide the tree">☰</button>
  <span id="crumbs"></span>
  <input id="q" type="search" placeholder="Search this area (Enter)">
  <label>Steps <select id="depth"><option>1</option><option>2</option></select></label>
  <label>Edge similarity ≥ <input id="min" type="range" min="0.4" max="0.95" step="0.01" value="0.75"> <span id="minv">0.75</span></label>
  <span id="stats"></span>
</header>
<main>
  <nav id="tree"><input id="tree-q" type="search" placeholder="Filter areas"><div id="tree-list"></div></nav>
  <section id="hits" hidden><h3><button id="hits-close">×</button><span id="hits-title"></span></h3><ol id="hits-list"></ol></section>
  <div id="graph"><div id="cy"></div><div id="hint"></div></div>
  <aside id="side"><button id="close">×</button><button id="around" title="Draw the sections around this one (or double-click it)">Around this</button><h2 id="title"></h2><div class="src" id="src"></div><pre id="text"></pre></aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
let cy, data, center = "", shown = null;  // center: the section drawn around; shown: the section in the side panel
let areas = {}, root, current = "", path = "";  // current: the area drawn; path: where the level drop-downs are

function store(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, value);
  } catch (e) { return null; }
}
const expanded = new Set(JSON.parse(store("txtai-areas-open") || "[]"));

// One colour per file, stable across reloads
function color(file) {
  let h = 0;
  for (const c of file) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h}, 65%, ${dark ? 62 : 45}%)`;
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${url}`);
  return r.json();
}

// The sections around one section: a whole area can have thousands, too many to lay out in a browser or to read
function draw() {
  const elements = [
    ...data.nodes.map((n) => ({ data: { ...n, color: color(n.file), size: 14 + 6 * Math.sqrt(n.chunks) },
      classes: n.id === center ? "center" : "" })),
    ...data.edges.map((e) => ({ data: { id: `${e.source}|${e.target}`, ...e } })),
  ];
  if (cy) cy.destroy();
  cy = cytoscape({
    container: $("cy"),
    elements,
    style: [
      { selector: "node", style: { "background-color": "data(color)", width: "data(size)", height: "data(size)",
        label: "data(label)", "font-size": 9, color: dark ? "#ddd" : "#333", "text-valign": "bottom", "text-margin-y": 3,
        "text-max-width": 120, "text-wrap": "ellipsis" } },
      { selector: "edge", style: { "curve-style": "haystack", width: "mapData(weight, 0.4, 0.95, 0.3, 3)", "line-color": dark ? "#556" : "#bbb",
        opacity: "mapData(weight, 0.4, 0.95, 0.25, 0.9)" } },
      { selector: ".faded", style: { opacity: 0.1 } },
      { selector: "node.center", style: { "border-width": 4, "border-color": dark ? "#fff" : "#000", "font-weight": "bold" } },
      { selector: "node:selected", style: { "border-width": 3, "border-color": dark ? "#fff" : "#000" } },
    ],
    layout: { name: "cose", animate: false, nodeRepulsion: 9000, idealEdgeLength: 80, randomize: true },
    wheelSensitivity: 0.3,
  });
  cy.on("tap", "node", (ev) => open(ev.target.data()));
  cy.on("dbltap", "node", (ev) => around(ev.target.id()));
  cy.on("mouseover", "node", (ev) => {
    const n = ev.target;
    cy.elements().addClass("faded");
    n.closedNeighborhood().removeClass("faded");
  });
  cy.on("mouseout", "node", () => cy.elements().removeClass("faded"));
  const c = data.nodes.find((n) => n.id === center);
  $("stats").textContent = `${data.nodes.length} sections · ${data.edges.length} edges around “${c ? c.label : center}”`;
}

function hint(text) {
  $("hint").textContent = text;
  $("hint").hidden = !text;
}

async function around(key) {
  center = key;
  $("minv").textContent = parseFloat($("min").value).toFixed(2);
  hint("…");
  const q = new URLSearchParams({ key, depth: $("depth").value, min_weight: $("min").value });
  data = await getJSON(`/ui/around/${encodeURIComponent(current)}?${q}`);
  hint(data.nodes.length > 1 ? "" : "No section is that similar to this one. Lower the edge similarity.");
  draw();
  for (const li of $("hits-list").children) li.classList.toggle("current", li.dataset.id === key);
  if ($("side").classList.contains("open")) open(data.nodes.find((n) => n.id === key));
}

async function search() {
  const q = $("q").value.trim();
  if (!q || !current) return;
  $("hits-title").textContent = "Searching…";
  $("hits").hidden = false;
  const hits = await getJSON(`/ui/search/${encodeURIComponent(current)}?${new URLSearchParams({ q })}`);
  $("hits-title").textContent = `${hits.length} sections for “${q}”`;
  $("hits-list").replaceChildren(...hits.map((h) => {
    const li = document.createElement("li");
    li.dataset.id = h.id;
    li.title = `${h.file}\nscore ${h.score}`;
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = h.label;
    const file = document.createElement("span");
    file.className = "file";
    file.textContent = h.file.split("/").pop();
    li.append(label, file);
    li.onclick = () => {
      if (matchMedia("(max-width: 700px)").matches) $("hits").hidden = true;
      around(h.id);
    };
    return li;
  }));
  if (hits.length) around(hits[0].id);
}

async function open(node) {
  shown = node.id;
  $("side").classList.add("open");
  $("around").hidden = node.id === center;
  $("title").textContent = node.label;
  $("src").textContent = node.file;
  $("text").textContent = "…";
  const r = await getJSON(`/ui/section/${encodeURIComponent(current)}?key=${encodeURIComponent(node.id)}`);
  $("src").textContent = r.source || node.file;
  $("text").textContent = r.text;
}

// A new area: nothing drawn until a search
function load() {
  store("txtai-areas-area", current);
  if (cy) cy.destroy();
  cy = null;
  center = "";
  $("hits").hidden = true;
  $("side").classList.remove("open");
  $("stats").textContent = `${areas[current]} chunks`;
  hint(`Search ${current}, then pick a section to see the sections around it.`);
}

// ---- Area names as a tree: academic.cs.ml -> academic > cs > ml. Every level above an area is shown, as a level
// that cannot be drawn (language.fr.hm.book needs language, fr and hm above it, or its "book" could be any book).
function buildTree(names) {
  const top = { name: "", full: "", children: new Map() };
  for (const a of names) {
    let n = top;
    a.split(".").forEach((p, i, ps) => {
      if (!n.children.has(p)) n.children.set(p, { name: p, full: ps.slice(0, i + 1).join("."), children: new Map() });
      n = n.children.get(p);
    });
  }
  return top;
}
const kids = (n) => [...n.children.values()].sort((a, b) => a.name.localeCompare(b.name));
const total = (n) => (areas[n.full] || 0) + kids(n).reduce((s, c) => s + total(c), 0);
function nodeOf(full) {
  let n = root;
  for (const p of full ? full.split(".") : []) n = n.children.get(p);
  return n;
}
// A level that is not an area and has only one level below is joined with it ("hm.book"), so deep names stay short
function compact(n) {
  let label = n.name;
  while (!(n.full in areas) && n.children.size === 1) {
    n = kids(n)[0];
    label += "." + n.name;
  }
  return [label, n];
}

function choose(area) {
  current = path = area;
  if (matchMedia("(max-width: 700px)").matches) setTree(false);
  for (let i = area.indexOf("."); i > 0; i = area.indexOf(".", i + 1)) expanded.add(area.slice(0, i));
  render();
  load();
}

// ---- Tree on the left
function toggle(full) {
  expanded.has(full) ? expanded.delete(full) : expanded.add(full);
  store("txtai-areas-open", JSON.stringify([...expanded]));
  renderTree();
}

function row(label, n, depthOpen) {
  const div = document.createElement("div");
  div.className = "row" + (n.full in areas ? " area" : "") + (n.full === current ? " current" : "");
  div.title = n.full;
  const tw = document.createElement("button");
  tw.className = "twisty";
  tw.textContent = n.children.size ? (depthOpen ? "▾" : "▸") : "";
  tw.disabled = !n.children.size;
  tw.onclick = (ev) => { ev.stopPropagation(); toggle(n.full); };
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = label;
  const count = document.createElement("span");
  count.className = "count";
  count.textContent = total(n);
  div.append(tw, name, count);
  div.onclick = () => (n.full in areas ? choose(n.full) : toggle(n.full));
  return div;
}

function renderTree() {
  const q = $("tree-q").value.trim().toLowerCase();
  if (q) {  // filtering: the matching areas by their full names, no levels
    const ul = document.createElement("ul");
    for (const a of Object.keys(areas).sort().filter((a) => a.toLowerCase().includes(q))) {
      const li = document.createElement("li");
      li.append(row(a, nodeOf(a), false));
      ul.append(li);
    }
    $("tree-list").replaceChildren(ul);
    return;
  }
  const list = (n) => {
    const ul = document.createElement("ul");
    for (const c of kids(n)) {
      const [label, end] = compact(c);
      const open = expanded.has(end.full);
      const li = document.createElement("li");
      li.append(row(label, end, open));
      if (end.children.size && open) li.append(list(end));
      ul.append(li);
    }
    return ul;
  };
  $("tree-list").replaceChildren(list(root));
}

function setTree(open) {
  $("tree").classList.toggle("closed", !open);
  $("treebtn").setAttribute("aria-pressed", open);
  store("txtai-areas-tree", open ? "open" : "closed");
}

// ---- One drop-down per level in the header: academic > cs > ml > hm.book
function descend(full) {
  let n = nodeOf(full);
  while (n.full && !(n.full in areas) && n.children.size === 1) n = kids(n)[0];
  if (n.full in areas) return choose(n.full);
  path = n.full;
  renderCrumbs();
}

function renderCrumbs() {
  const box = $("crumbs");
  box.replaceChildren();
  let n = root;
  while (n.children.size) {
    const here = n;
    const sel = document.createElement("select");
    // "…" at a level that is not an area: choose below; "—" at an area that has areas below: stay here
    sel.add(new Option(here.full in areas ? "—" : "…", ""));
    let next = null;
    for (const c of kids(here)) {
      const [label, end] = compact(c);
      sel.add(new Option(`${label} (${total(end)})`, end.full));
      if (path === end.full || path.startsWith(end.full + ".")) next = end;
    }
    sel.value = next ? next.full : "";
    sel.onchange = () => (sel.value ? descend(sel.value) : here.full ? choose(here.full) : null);
    if (box.children.length) {
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "›";
      box.append(sep);
    }
    box.append(sel);
    if (!next) break;
    n = next;
  }
}

function setMode(mode) {
  document.body.className = `mode-${mode}`;
  $("m-tree").setAttribute("aria-pressed", mode === "tree");
  $("m-crumbs").setAttribute("aria-pressed", mode === "crumbs");
  store("txtai-areas-mode", mode);
}

function render() {
  renderTree();
  renderCrumbs();
}

(async () => {
  areas = await getJSON("/ui/areas");
  root = buildTree(Object.keys(areas));
  setMode(store("txtai-areas-mode") === "crumbs" ? "crumbs" : "tree");
  setTree(store("txtai-areas-tree") !== "closed" && !matchMedia("(max-width: 700px)").matches);
  $("m-tree").onclick = () => setMode("tree");
  $("m-crumbs").onclick = () => setMode("crumbs");
  $("treebtn").onclick = () => setTree($("tree").classList.contains("closed"));
  $("tree-q").oninput = renderTree;
  $("q").onkeydown = (ev) => { if (ev.key === "Enter") search(); };
  $("min").oninput = () => ($("minv").textContent = parseFloat($("min").value).toFixed(2));
  $("min").onchange = $("depth").onchange = () => center && around(center);
  $("hits-close").onclick = () => ($("hits").hidden = true);
  $("close").onclick = () => $("side").classList.remove("open");
  $("around").onclick = () => shown && around(shown);
  const saved = store("txtai-areas-area");
  const first = saved && saved in areas ? saved : Object.keys(areas).sort()[0];
  if (first) choose(first);
  else render();
})();
</script>
</body>
</html>
